# Mini Numbers - Docker Compose (SQLite, automatic HTTPS)
#
# 1. Point a domain (for example stats.example.com) at this server's IP address.
# 2. echo "DOMAIN=stats.example.com" > .env
# 3. docker compose up -d
# 4. Open https://stats.example.com and complete the setup wizard.
#
# Caddy gets and renews the HTTPS certificate by itself; ports 80 and 443 must be free.
# Upgrade: docker compose pull && docker compose up -d   (your data stays in the volumes)
# Build from source instead: in a clone of the repo, replace the image line with `build: .`
#
# Pre-configured setup (skip the wizard): put ADMIN_PASSWORD and SERVER_SALT in .env too
# (see .env.example).

services:
  mini-numbers:
    image: ghcr.io/onemanstudiodotse/mini-numbers:latest
    container_name: mini-numbers
    restart: unless-stopped
    volumes:
      - analytics-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - DB_TYPE=SQLITE
      - DB_SQLITE_PATH=/app/data/stats.db
      # Only Caddy can reach this container, so the visitor IP it forwards can be trusted
      - TRUST_PROXY=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2
    container_name: mini-numbers-caddy
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?Set DOMAIN in .env, for example DOMAIN=stats.example.com} --to mini-numbers:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    depends_on:
      - mini-numbers

volumes:
  analytics-data:
  caddy-data:
