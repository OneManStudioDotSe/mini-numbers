# Mini Numbers - Docker Compose (PostgreSQL, automatic HTTPS)
#
# Same as docker-compose.yml, but stores data in PostgreSQL instead of SQLite.
#
# 1. Point a domain (for example stats.example.com) at this server's IP address.
# 2. Create .env with:
#      DOMAIN=stats.example.com
#      DB_PG_PASSWORD=<a long random password>
# 3. docker compose -f docker-compose.postgres.yml up -d
# 4. Open https://stats.example.com and complete the setup wizard.
#
# Caddy gets and renews the HTTPS certificate by itself; ports 80 and 443 must be free.
# Upgrade: docker compose -f docker-compose.postgres.yml pull && docker compose -f docker-compose.postgres.yml up -d
# Build from source instead: in a clone of the repo, replace the image line with `build: .`

services:
  mini-numbers:
    image: ghcr.io/onemanstudiodotse/mini-numbers:latest
    container_name: mini-numbers
    restart: unless-stopped
    volumes:
      - analytics-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - DB_TYPE=POSTGRESQL
      - DB_PG_HOST=postgres
      - DB_PG_PORT=5432
      - DB_PG_NAME=mini_numbers
      - DB_PG_USERNAME=analytics
      - DB_PG_PASSWORD=${DB_PG_PASSWORD:?Set DB_PG_PASSWORD in .env}
      # Only Caddy can reach this container, so the visitor IP it forwards can be trusted
      - TRUST_PROXY=true
      # Zone for "today", hour/day charts and email send hours; timestamps are sent with this offset
      - TZ=${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: mini-numbers-db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mini_numbers
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${DB_PG_PASSWORD:?Set DB_PG_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d mini_numbers"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2
    container_name: mini-numbers-caddy
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?Set DOMAIN in .env, for example DOMAIN=stats.example.com} --to mini-numbers:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    depends_on:
      - mini-numbers

volumes:
  analytics-data:
  postgres-data:
  caddy-data:
