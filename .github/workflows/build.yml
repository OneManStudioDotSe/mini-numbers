name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mini
          POSTGRES_PASSWORD: mini
          POSTGRES_DB: mini_numbers
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_TYPE: POSTGRESQL
      DB_PG_HOST: localhost
      DB_PG_PORT: '5432'
      DB_PG_NAME: mini_numbers
      DB_PG_USERNAME: mini
      DB_PG_PASSWORD: mini

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests against PostgreSQL
        run: ./gradlew test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Build fat JAR
        run: ./gradlew buildFatJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-numbers-jar
          path: build/libs/*-all.jar
          retention-days: 7

      - name: Verify Docker build
        run: docker build -t mini-numbers:ci-test .

      - name: Browser tests (Playwright against the fat JAR)
        working-directory: e2e
        run: |
          npm ci
          npx playwright test

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/screenshots
            e2e/test-results
          retention-days: 7

      - name: Test Docker health check
        run: |
          docker run -d --name mn-test -p 18080:8080 \
            -e ADMIN_PASSWORD=ci-test-password \
            -e SERVER_SALT=$(openssl rand -hex 64) \
            mini-numbers:ci-test
          sleep 20
          curl --fail --retry 3 --retry-delay 5 http://localhost:18080/health || exit 1
          docker stop mn-test
          docker rm mn-test

      - name: Test that setup survives recreating the container
        run: |
          docker volume create mn-data
          docker run -d --name mn-persist -p 18081:8080 -v mn-data:/app/data mini-numbers:ci-test
          sleep 20
          curl --fail --retry 3 --retry-delay 5 -H 'Content-Type: application/json' \
            -d "{\"adminUsername\":\"admin\",\"adminPassword\":\"ci-persist-password\",\"serverSalt\":\"$(openssl rand -hex 64)\",\"privacyMode\":\"STANDARD\",\"allowedOrigins\":\"\",\"database\":{\"type\":\"sqlite\",\"sqlitePath\":\"./stats.db\"},\"server\":{\"port\":9999,\"isDevelopment\":false},\"geoip\":{\"databasePath\":\"./geo.mmdb\"},\"rateLimit\":{\"perIp\":1000,\"perApiKey\":10000}}" \
            http://localhost:18081/setup/api/save
          docker rm -f mn-persist
          docker run -d --name mn-persist -p 18081:8080 -v mn-data:/app/data mini-numbers:ci-test
          sleep 20
          # Still configured, and still on 8080 even though the wizard saved SERVER_PORT=9999
          curl --fail --retry 3 --retry-delay 5 http://localhost:18081/health | tee health.json
          grep -q '"setupNeeded":false' health.json
          docker rm -f mn-persist
          docker volume rm mn-data
