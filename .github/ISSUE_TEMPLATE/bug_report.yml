name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Mini Numbers version
      description: From `/health` or the release you installed
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is it running?
      options: [Docker image, Fat JAR, From source]
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, PostgreSQL]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, what happened instead. Include the exact error text or a screenshot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Server log around the time of the problem. Remove salts, passwords and API keys first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed secrets, IP addresses and anything that identifies a visitor from this report
          required: true
