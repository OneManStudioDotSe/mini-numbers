name: Feature request
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job to be done, not the solution. Who needs it and how often.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A sketch is welcome. If another tool does this well, name it.
  - type: dropdown
    id: privacy
    attributes:
      label: Does it need new data about visitors?
      description: Mini Numbers stores no PII and no persistent identifiers; features that need either are unlikely to be accepted.
      options: ["No", "Yes, and here is why it is still privacy-safe", "Not sure"]
    validations:
      required: true
